services:
  postgres:
    image: postgres:18
    container_name: snapwedding-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: snap
      POSTGRES_PASSWORD: snap
      POSTGRES_DB: snapwedding
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

  # Stockage objet compatible S3 : les photos ne vont jamais en base ni sur le disque du serveur
  rustfs:
    image: rustfs/rustfs:1.0.4
    container_name: snapwedding-rustfs
    restart: unless-stopped
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ACCESS_KEY: rustfsadmin
      RUSTFS_SECRET_KEY: rustfsadmin
      RUSTFS_CONSOLE_ENABLE: "true"
    ports:
      - "9000:9000"   # API S3 (utilisée par Spring)
      - "9001:9001"   # Console web : http://localhost:9001/rustfs/console/
    volumes:
      - rustfs_data:/data

volumes:
  postgres_data:
  rustfs_data:
