# Option "Intégration continue" : à chaque push ou pull request, GitHub relance tout seul
# les tests du back (avec un vrai PostgreSQL via Testcontainers) et la compilation du front.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Back (tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # Pas de vrai secret en CI : les tests simulent les JWT Google.
      GOOGLE_CLIENT_ID: ci-test-client-id
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Rendre le wrapper Maven exécutable (commité depuis Windows)
        run: chmod +x mvnw
      - name: Tests (unitaires, Modulith, intégration Testcontainers)
        run: ./mvnw -B verify

  frontend:
    name: Front (compilation)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Vérification des types TypeScript
        run: npx tsc -p tsconfig.app.json --noEmit
      - name: Build Vite
        run: npm run build
